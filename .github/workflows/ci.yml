name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      # Only the db container is needed: pgTAP exercises RLS directly at the
      # SQL level (set local role authenticated + request.jwt.claims), no
      # PostgREST/GoTrue/Studio/etc. required. See supabase/tests/*.sql.
      - run: supabase start -x edge-runtime,gotrue,imgproxy,kong,logflare,mailpit,postgres-meta,postgrest,realtime,storage-api,studio,supavisor,vector
      - run: supabase test db --local

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # db + auth + rest + kong: the specs drive real sign-in (auth) and
      # finance-data reads/writes (rest, via the kong gateway) as the seeded
      # test@percorso.local user. See TOOL-7 in docs/AUDIT-TASKS.md.
      - run: supabase start -x edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector
      - run: supabase db reset
      # webServer in playwright.config.ts starts `npm run dev`, which reads
      # the committed .env.development (local Supabase, safe fake keys).
      - run: npm run e2e

  madge:
    runs-on: ubuntu-latest
    # Non-blocking: the store/ split has one documented, intentional cycle
    # (store.ts <-> cards.ts, extending through bills.ts/transactions.ts —
    # every entity module imports patch/state from store.ts, and store.ts
    # imports syncCardBills from cards.ts for load()). The call happens
    # inside a function body, never at module-evaluation time, so it's safe;
    # see ARCH-4 in docs/AUDIT-TASKS.md. This job is a signal for *new*
    # cycles, not a gate on the known one.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run madge

  lighthouse:
    runs-on: ubuntu-latest
    # Non-blocking: perf scores are noisy on shared runners, and this checks
    # the unauthenticated /login page only (Lighthouse can't drive Supabase
    # auth) — a signal to watch, not a merge gate. See TOOL-5 in
    # docs/AUDIT-TASKS.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Local Supabase env (committed, safe fake keys) so /login renders for
      # real instead of the "not configured" notice.
      - run: npx vite build --mode development
      - run: npx lhci autorun
